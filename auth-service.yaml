openapi: 3.0.3
info:
  title: Auth Service API
  version: 1.0.0
  description: Микросервис аутентификации и авторизации
servers:
  - url: https://api.smarthouse.com/v1/
tags:
  - name: Authentication
    description: Операции аутентификации
  - name: Users
    description: Управление пользователями

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Регистрация нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
            example:
              email: "user@example.com"
              password: "суперсложныйпароль123"
              name: "Вася Пупкин"
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              example:
                userId: "a1b2c3d4-e5f6-7890"
                status: "created"
        '400':
          description: Неверные входные данные
        '409':
          description: Пользователь уже существует

  /auth/login:
    post:
      tags: [Authentication]
      summary: Аутентификация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
            example:
              email: "user@example.com"
              password: "суперсложныйпароль123"
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          description: Неверные учетные данные

  /auth/token/refresh:
    post:
      tags: [Authentication]
      summary: Обновление токена доступа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
            example:
              refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Токен обновлен
        '401':
          description: Недействительный refresh token

  /users/{userId}:
    get:
      tags: [Users]
      summary: Получение информации о пользователе
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              example:
                id: "a1b2c3d4-e5f6-7890"
                email: "user@example.com"
                name: "Вася Пупкин"
        '404':
          description: Пользователь не найден

  /users/{userId}/permissions:
    get:
      tags: [Users]
      summary: Получение прав доступа пользователя
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Список прав доступа
          content:
            application/json:
              example:
                permissions: ["house:read", "devices:control"]

components:
  schemas:
    UserRegister:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }
    UserLogin:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshToken:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string